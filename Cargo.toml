[package]
name = "echelon-runtime"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
async-trait = "0.1"
thiserror = "1"
include_dir = "0.7"
serde_yaml = "0.9"
indexmap = "2.14.1"
reqwest = {
    version = "0.12",
    default-features = false,
    features = ["json", "rustls-tls"]
}

[[bin]]
name = "echelon"
path = "src/main.rs"
